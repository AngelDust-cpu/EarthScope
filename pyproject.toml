[project]
name = "earthscope"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "scipy>=1.13,<2",
    "httpx>=0.28,<1",
    "uvicorn>=0.34,<1",
    "reportlab>=4,<6",
]

[dependency-groups]
dev = [
    "pypdf>=5,<7",
    "pytest>=8,<10",
    "truststore>=0.10,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
